services:

  # Databases

  postgres-wallet:
    image: postgres:16-alpine
    container_name: nexpay-postgres-wallet
    environment:
      POSTGRES_DB: wallet_db
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexpay-network

  postgres-payment:
    image: postgres:16-alpine
    container_name: nexpay-postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: nexpay
      POSTGRES_PASSWORD: nexpay_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexpay -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexpay-network

  redis:
    image: redis:7-alpine
    container_name: nexpay-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexpay-network

  # LocalStack (AWS)

  localstack:
    image: localstack/localstack:3.4
    container_name: nexpay-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,sqs,sns,dynamodb,secretsmanager
      - DEBUG=0
      - DEFAULT_REGION=us-east-1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ./infrastructure/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexpay-network

  # Microservices

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: nexpay-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - WALLET_SERVICE_URL=http://wallet-service:8081
      - PAYMENT_SERVICE_URL=http://payment-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
    depends_on:
      wallet-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - nexpay-network

  wallet-service:
    build:
      context: ./services/wallet-service
      dockerfile: Dockerfile
    container_name: nexpay-wallet
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-wallet:5432/wallet_db
      - SPRING_DATASOURCE_USERNAME=nexpay
      - SPRING_DATASOURCE_PASSWORD=nexpay_secret
      - SPRING_DATA_REDIS_HOST=redis
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-wallet:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      - nexpay-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: nexpay-payment
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-payment:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=nexpay
      - SPRING_DATASOURCE_PASSWORD=nexpay_secret
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - WALLET_SERVICE_URL=http://wallet-service:8081
      - SPRING_DATA_REDIS_HOST=redis
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      postgres-payment:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      - nexpay-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: nexpay-notification
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    networks:
      - nexpay-network

  # Observability

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: nexpay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - nexpay-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: nexpay-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=nexpay
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - nexpay-network

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: nexpay-zipkin
    ports:
      - "9411:9411"
    networks:
      - nexpay-network

  # ELK Stack

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: nexpay-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexpay-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: nexpay-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nexpay-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: nexpay-logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./infrastructure/logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nexpay-network

volumes:
  postgres_wallet_data:
  postgres_payment_data:
  localstack_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  nexpay-network:
    driver: bridge
