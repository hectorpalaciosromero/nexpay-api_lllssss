apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: nexpay
  labels:
    app: payment-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: payment-service
          image: nexpay/payment-service:latest
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: url
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-secret
                  key: password
            - name: AWS_SQS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: sqs-endpoint
            - name: AWS_DYNAMODB_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: dynamodb-endpoint
            - name: AWS_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: aws-config
                  key: s3-endpoint
            - name: WALLET_SERVICE_URL
              value: "http://wallet-service:8081"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: nexpay
  labels:
    app: payment-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: payment-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service-hpa
  namespace: nexpay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-config
  namespace: nexpay
data:
  sqs-endpoint: "http://localstack:4566"
  dynamodb-endpoint: "http://localstack:4566"
  s3-endpoint: "http://localstack:4566"
  region: "us-east-1"
