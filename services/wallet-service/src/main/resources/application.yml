server:
  port: 8081

spring:
  application:
    name: wallet-service

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/wallet_db
    username: nexpay
    password: nexpay_secret
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes

# Actuator (Observability)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests (dev only)
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: NexPay Wallet Service API
    version: 1.0.0
    description: Manages digital wallets, balances, and financial movements

# Logging
logging:
  level:
    com.nexpay: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
