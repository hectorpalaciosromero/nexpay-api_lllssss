server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Route Definitions
      routes:
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/wallets/**
          filters:
            - name: CircuitBreaker
              args:
                name: walletServiceCB
                fallbackUri: forward:/fallback/wallet

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payment

        - id: wallet-swagger
          uri: ${WALLET_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/wallet/swagger-ui.html,/wallet/api-docs/**

        - id: payment-swagger
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/payment/swagger-ui.html,/payment/api-docs/**

      # CORS — allow all origins for local development.
      # TODO: restrict to specific domains in production (e.g. https://app.nexpay.com)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # Default Filters
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Powered-By, NexPay-Gateway

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.nexpay: DEBUG
    org.springframework.cloud.gateway: DEBUG
