name: NexPay CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build all modules
        run: mvn clean compile -B

      - name: Run tests
        run: mvn test -B

      - name: Generate coverage report
        if: always()
        continue-on-error: true
        run: mvn jacoco:report -pl services/wallet-service -B

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/'

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'

  docker-build:
    runs-on: ubuntu-latest
    name: Docker Build
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JARs
        run: mvn clean package -DskipTests -B

      - name: Build Docker images
        run: |
          docker build -t nexpay/api-gateway:latest ./services/api-gateway
          docker build -t nexpay/wallet-service:latest ./services/wallet-service
          docker build -t nexpay/payment-service:latest ./services/payment-service
          docker build -t nexpay/notification-service:latest ./services/notification-service

      - name: Verify images
        run: docker images --filter "reference=nexpay/*"
